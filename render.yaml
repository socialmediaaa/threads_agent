services:
  - type: web
    name: threads-agent-web
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: threads-db
          property: connectionString

  - type: worker
    name: threads-agent-worker
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake solid_queue:start"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: threads-db
          property: connectionString

databases:
  - name: threads-db
    databaseName: threads_production
    user: threads_user
    plan: free